server {
    listen 80 default_server;
    server_name _;

    # No upload size limit (the app accepts forensic images of any size).
    client_max_body_size 0;

    root __APP_DIR__/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Only /api is exposed. The A2A endpoint the backend mounts at / stays
    # reachable on 127.0.0.1:8000 only.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large uploads straight to the backend instead of buffering.
        proxy_request_buffering off;

        # Investigations take several minutes on a CPU-only model.
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
    }
}
